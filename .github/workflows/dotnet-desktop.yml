name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Build & Test .NET 8 Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Dependencies
      run: |
        dotnet restore backend/HealthBridge.Api.csproj
        dotnet restore tests/HealthBridge.Tests/HealthBridge.Tests.csproj

    - name: Build Backend & Tests (Release)
      run: |
        dotnet build backend/HealthBridge.Api.csproj --configuration Release --no-restore
        dotnet build tests/HealthBridge.Tests/HealthBridge.Tests.csproj --configuration Release

    - name: Run Automated Backend & Agent Tests
      run: dotnet test tests/HealthBridge.Tests/HealthBridge.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-ci:
    name: Build & Verify React Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      working-directory: frontend-react
      run: npm ci

    - name: Build Frontend (Production)
      working-directory: frontend-react
      run: npm run build

  flutter-ci:
    name: Analyze Flutter Mobile App
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Install Flutter Dependencies
      working-directory: flutter-app
      run: flutter pub get

    - name: Static Code Analysis
      working-directory: flutter-app
      run: flutter analyze --no-fatal-infos
