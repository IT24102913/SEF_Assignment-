name: CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build:
    name: Build & Verify .NET 8 Backend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore Backend Dependencies
      run: dotnet restore backend/HealthBridge.Api.csproj

    - name: Build Backend (Release)
      run: dotnet build backend/HealthBridge.Api.csproj --configuration Release --no-restore

  frontend-build:
    name: Build & Verify React Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Frontend Dependencies
      working-directory: frontend-react
      run: npm ci

    - name: Build Frontend (Production)
      working-directory: frontend-react
      run: npm run build
