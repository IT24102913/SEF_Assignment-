name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter-app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter-app
        run: flutter build apk --release --dart-define=BACKEND_URL="https://sefassignment-production.up.railway.app"

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthbridge-app-release
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
