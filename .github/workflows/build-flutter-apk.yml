name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter-app/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

permissions:
  contents: write # Grants permission to publish the release asset

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Build Release APK
        working-directory: flutter-app
        run: flutter build apk --release --dart-define=BACKEND_URL="https://sefassignment-production.up.railway.app"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthbridge-app-release
          path: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish Permanent Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HealthBridge Release v1.0.${{ github.run_number }}
          body: |
            ## HealthBridge Flutter Mobile Application (Android)
            - **Target Platform:** Android (Universal Release APK)
            - **Backend Connected:** `https://sefassignment-production.up.railway.app`
            
            ### Instructions for Evaluators:
            1. Download `app-release.apk` below directly to your Android device or emulator.
            2. Enable *Install from Unknown Sources* if prompted.
            3. Open and log in using either patient credentials or register a new account.
          files: flutter-app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
